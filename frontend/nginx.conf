server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        add_header X-Content-Type-Options nosniff;
    }
}
