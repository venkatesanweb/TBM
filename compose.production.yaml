name: tamirabot

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    profiles: ["production"]
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Kolkata
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_lock_waits=on
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *json-logging
    networks: [app]

  web:
    profiles: ["production"]
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_HOST: db
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS in .env}
      DJANGO_HTTPS_ENABLED: "True"
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
      TWO_FACTOR_AUTHENTICATION_ENABLED: ${TWO_FACTOR_AUTHENTICATION_ENABLED:-False}
      SUPER_ADMIN_TOTP_SECRETS_JSON: ${SUPER_ADMIN_TOTP_SECRETS_JSON:-}
      MEDIA_ROOT: /app/media
      BACKUP_OUTPUT_DIR: /backups
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-14}
      TAMIRABOT_APP_VERSION: ${TAMIRABOT_APP_VERSION:-0.1.0}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-3600}
      PYTHONFAULTHANDLER: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
      - ${BACKUP_HOST_DIRECTORY:?Set BACKUP_HOST_DIRECTORY in .env}:/backups
    expose: ["8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *json-logging
    networks: [app]

  frontend:
    profiles: ["production"]
    build:
      context: ./frontend
    restart: unless-stopped
    volumes:
      - media:/usr/share/nginx/html/media:ro
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *json-logging
    networks: [app]

  caddy:
    profiles: ["production"]
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    environment:
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
    volumes:
      - ./deploy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_healthy
    expose: ["80"]
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *json-logging
    networks: [app, tunnel]

  cloudflared:
    profiles: ["production"]
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      caddy:
        condition: service_healthy
    logging: *json-logging
    networks: [tunnel]

volumes:
  pgdata:
  media:
  staticfiles:
  caddy_data:
  caddy_config:

networks:
  app:
    internal: true
  tunnel:
